services:
  - type: web
    name: reto-03-ordenes-compra
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gemini-3-flash-preview
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_TOKENS_DIA
        value: "500000"
